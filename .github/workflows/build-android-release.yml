name: Build Android Release

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Production backend API URL ending with /api
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate API base URL
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          # Inputs arrive via env, never interpolated into the script, to prevent shell injection
          case "$API_BASE_URL" in
            https://*[!A-Za-z0-9./:_-]*) echo "api_base_url contains invalid characters"; exit 1 ;;
            https://*/api) ;;
            *)
              echo "api_base_url must be a full https URL ending with /api"
              exit 1
              ;;
          esac

      - name: Restore Android signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > mobile/android/upload-keystore.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > mobile/android/key.properties

      - name: Build signed APK
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          cd mobile
          flutter pub get
          flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiftsure-android-apk-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
